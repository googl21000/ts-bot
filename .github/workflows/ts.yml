name: TS Bot

on:
  schedule:
    - cron: '30 5,6 * * 1-5'
    - cron: '30 10,11 * * 1-5'
  workflow_dispatch:
    inputs:
      test:
        description: 'Only send a Telegram test message'
        type: boolean
        default: false

# prevents two runs from alerting twice (summer/winter time overlap)
concurrency:
  group: ts-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas requests
      - name: Run bot
        env:
          ONE_SHOT: "1"
          TWELVEDATA_KEY: ${{ secrets.TWELVEDATA_KEY }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TEST_ONLY: ${{ github.event.inputs.test }}
        run: |
          if [ "$TEST_ONLY" = "true" ]; then
            python ts_bot.py --test
          else
            python ts_bot.py
          fi
