
name: TS bot Backtest

on:
  workflow_dispatch:
    inputs:
      days:
        description: "عدد الأيام للباكتيست"
        required: true
        default: "90"

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 150

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests

      - name: Run TS bot Backtest
        run: python backtest.py
        env:
          BT_DAYS: ${{ inputs.days }}
          TWELVEDATA_KEY: ${{ secrets.TWELVEDATA_KEY }}

      - name: Upload Backtest CSV
        uses: actions/upload-artifact@v4
        with:
          name: TS-bot-backtest-results
          path: backtest_trades.csv
          if-no-files-found: error
