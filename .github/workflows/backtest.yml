name: Backtest

on:
  workflow_dispatch:
    inputs:
      days:
        description: 'Days back'
        type: string
        default: '90'
      htf_required:
        description: 'Require a 30m FVG/OB at the sweep'
        type: boolean
        default: true
      cancel_half_if:
        description: 'Cancel the :30 candle if the :00 candle ...'
        type: choice
        options:
          - sweep
          - setup
        default: sweep
      entry_mode:
        description: 'Entry inside the zone'
        type: choice
        options:
          - proximal
          - mid
        default: proximal

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas requests matplotlib
      - name: Run backtest
        env:
          TWELVEDATA_KEY: ${{ secrets.TWELVEDATA_KEY }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
          DAYS: ${{ github.event.inputs.days }}
          HTF_REQUIRED: ${{ github.event.inputs.htf_required }}
          CANCEL_HALF_IF: ${{ github.event.inputs.cancel_half_if }}
          ENTRY_MODE: ${{ github.event.inputs.entry_mode }}
        run: python backtest.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backtest-results
          path: |
            backtest_summary.txt
            backtest_trades.csv
            backtest_equity.png
          if-no-files-found: ignore
