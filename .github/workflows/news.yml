name: News Bot

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "run / test / digest / dry"
        default: "run"

concurrency:
  group: news-bot
  cancel-in-progress: false

jobs:
  news:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: news_state.json
          key: news-state-${{ github.run_id }}
          restore-keys: news-state-

      - name: Run bot
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LOCAL_TZ: Africa/Algiers
          NEWS_CURRENCIES: USD,EUR,GBP
          MIN_IMPACT: High
          ALERT_BEFORE_MIN: "30"
          DIGEST_HOUR_NY: "1"
          NEWS_MIN_SCORE: "3"
        run: |
          case "${{ github.event.inputs.mode }}" in
            test)   python news_bot.py --test ;;
            digest) python news_bot.py --digest ;;
            dry)    python news_bot.py --dry ;;
            *)      python news_bot.py ;;
          esac

      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: news_state.json
          key: news-state-${{ github.run_id }}
